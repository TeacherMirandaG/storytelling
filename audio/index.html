<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storytelling Simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ff;--card:#fff;--ink:#2d2650;--pri:#7c5cff;--mint:#3ecf9a;--coral:#ff7a8a;--sun:#ffd23f;--line:#dcd3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 20px/1.5 'Franxurter','Frankfurter','Fredoka','Trebuchet MS',sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 20px;background:#fff;border-bottom:4px solid var(--sun)}
h1{margin:0;font-size:1.5rem;color:var(--pri)}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px}
button{font:inherit;font-weight:600;min-height:56px;padding:10px 22px;border-radius:18px;border:3px solid var(--pri);background:#fff;color:var(--pri);cursor:pointer}
button:hover{background:#efeaff}
button.go{background:var(--pri);color:#fff}
button.go:hover{background:#6a49f0}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:var(--mint);border-color:#1fa97a;color:#073d2b}
:focus-visible{outline:4px solid #ff9f1c;outline-offset:3px}
.es{display:none}
body.tr .es{display:block;font-size:.78em;font-weight:400;color:#5b3fd1}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.step{flex:1;min-width:120px;padding:8px 12px;border-radius:16px;background:#ece7ff;text-align:center;font-size:.85em}
.step.cur{background:var(--pri);color:#fff}
.step.ok{background:#c8f5e3}
.stars{color:#ff9f1c;letter-spacing:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
svg.scene{width:100%;height:auto;border-radius:20px;border:3px solid var(--line);display:block}
.story p{margin:.4em 0}
.story .sn{padding:2px 6px;border-radius:10px;display:inline}
.story .hl{background:#fff1a8}
.blank{display:inline-block;min-width:90px;border-bottom:4px dashed var(--pri);text-align:center;color:var(--pri)}
.opts{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
input[type=text]{font:inherit;font-size:1.1em;padding:10px 14px;border-radius:16px;border:3px solid var(--line);min-height:56px;width:min(100%,260px)}
.fb{margin-top:12px;padding:12px 16px;border-radius:18px;font-weight:600}
.fb.good{background:#d9f9ec;color:#0a5a3e}
.fb.try{background:#fff0d6;color:#7a4a00}
.grp{margin-bottom:14px}
.grp b{display:block;margin-bottom:6px}
.chip{min-height:52px;padding:6px 16px}
.bar{height:14px;background:#ece7ff;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--sun),var(--mint))}
.bank{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.bank>span{background:#ffe9ef;border-radius:12px;padding:2px 12px}
#grid{display:grid;gap:3px;max-width:520px;margin:12px auto;touch-action:manipulation}
.cell{min-height:0;padding:0;border-radius:8px;border:2px solid #dcd3ff;aspect-ratio:1;font-size:clamp(14px,4.4vw,24px);font-weight:600;color:var(--ink);background:#fff}
.cell:hover{background:#f1ecff}
.cell.sel{background:#fff1a8;border-color:#ff9f1c}
.cell.fnd{background:#bff0dc;border-color:#1fa97a}
.wl{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.wl>span{background:#f1ecff;border-radius:12px;padding:2px 12px;font-size:.85em}
.wl>span.ok{background:#bff0dc;text-decoration:line-through}
.badge{display:inline-block;background:#d9f9ec;color:#0a5a3e;border:3px solid #1fa97a;border-radius:20px;padding:8px 22px;font-size:1.3em;font-weight:600}
footer{text-align:center;padding:18px;font-size:.8em;color:#6b6490}
pre{white-space:pre-wrap;font:inherit;background:#f3f0ff;border-radius:16px;padding:14px}
@media(max-width:600px){body{font-size:18px}.card{padding:14px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
</head>
<body>
<header>
  <h1>🎈 Storytelling Simulation</h1>
  <button id="tr" onclick="toggleES()" aria-pressed="false">🇨🇱 Español (Chile): OFF</button>
</header>
<main id="app" aria-live="polite"></main>
<footer>Recurso elaborado con apoyo de IA · No recopila datos de estudiantes · Imágenes dibujadas con código · Audio con voz ElevenLabs</footer>
<script>
const T=(en,es)=>`<span>${en}</span><span class="es">${es}</span>`;
const COL={blue:['#4aa8ff','azul'],red:['#ff5d6c','rojo'],green:['#43c77a','verde'],yellow:['#ffd23f','amarillo'],pink:['#ff8fc7','rosado'],purple:['#9b7bff','morado']};
const PL={park:['park','al parque','parque'],beach:['beach','a la playa','playa'],mountain:['mountain','a la montaña','montaña']};
const WE={sunny:['sunny','soleado'],cloudy:['cloudy','nublado'],rainy:['rainy','lluvioso'],snowy:['snowy','nevado']};
const SKY={sunny:['yellow sun','el sol amarillo'],cloudy:['white clouds','las nubes blancas'],rainy:['grey clouds','las nubes grises'],snowy:['white snow','la nieve blanca']};
const HB={soccer:['playing soccer','jugar al fútbol','⚽'],drawing:['drawing','dibujar','🎨'],dancing:['dancing','bailar','💃'],reading:['reading','leer','📚'],swimming:['swimming','nadar','🏊']};
const AGE={10:['ten','diez'],11:['eleven','once'],12:['twelve','doce'],13:['thirteen','trece'],14:['fourteen','catorce']};
const D0={place:'park',weather:'cloudy',color:'blue',age:12,hobby:null,shirt:null};
let S={es:0,st:'read',c:{...D0},l3:1,q:null,stat:{read:[0,0],write:[0,0],tense:[0,0]},miss:[]};

function story(c){const k=COL[c.color][1];return [
['Leo is a boy.','Leo es un niño.'],
[`He is ${AGE[c.age][0]} years old.`,`Tiene ${AGE[c.age][1]} años.`],
['Today is his birthday.','Hoy es su cumpleaños.'],
c.hobby&&[`Leo likes ${HB[c.hobby][0]}.`,`A Leo le gusta ${HB[c.hobby][1]}.`],
c.shirt&&[`He wears a ${c.shirt} T-shirt.`,`Lleva una polera ${COL[c.shirt][1]}.`],
[`His grandfather gives him a big ${c.color} balloon.`,`Su abuelo le regala un globo grande ${k}.`],
['Leo loves it very much.','A Leo le encanta.'],
['He holds the string.','Sostiene el hilo.'],
[`They walk to the ${PL[c.place][0]}.`,`Caminan ${PL[c.place][1]}.`],
[`It is a ${c.weather} day.`,`Es un día ${WE[c.weather][1]}.`],
['The wind is strong. Whoosh!','El viento está fuerte. ¡Fium!'],
['The balloon flies up into the sky.','El globo vuela hacia el cielo.'],
['Leo cries. “My balloon!” he says.','Leo llora. «¡Mi globo!», dice.'],
['His grandfather smiles. “Look, Leo!”','Su abuelo sonríe. «¡Mira, Leo!»'],
['Leo looks up.','Leo mira hacia arriba.'],
[`The ${c.color} balloon is high in the sky.`,`El globo ${k} está alto en el cielo.`],
[`It looks like a little ${c.color} star next to the ${SKY[c.weather][0]}.`,`Parece una pequeña estrella ${k} junto a ${SKY[c.weather][1]}.`],
['Leo smiles. “It is free now.”','Leo sonríe. «Ahora está libre».']].filter(Boolean)}

function scene(c){
 const sky={sunny:'#bfe9ff',cloudy:'#d5dcf0',rainy:'#aab9d8',snowy:'#e6eefb'}[c.weather];
 const bl=COL[c.color][0],sh=c.shirt?COL[c.shirt][0]:'#fff';
 const cl=(x,y,f)=>`<g fill="${f}"><ellipse cx="${x}" cy="${y}" rx="30" ry="14"/><ellipse cx="${x+18}" cy="${y-8}" rx="20" ry="12"/></g>`;
 let g={park:'<rect y="150" width="320" height="50" fill="#9be3a6"/><rect x="262" y="95" width="10" height="60" fill="#b98b6a"/><circle cx="267" cy="85" r="30" fill="#6fd08a"/><circle cx="250" cy="102" r="18" fill="#7edc98"/>',
 beach:'<rect y="115" width="320" height="35" fill="#7fd3e8"/><path d="M0 120q40-10 80 0t80 0 80 0 80 0" stroke="#fff" stroke-width="3" fill="none"/><rect y="150" width="320" height="50" fill="#ffe2a8"/>',
 mountain:'<path d="M10 150L100 60L190 150Z" fill="#b7a8e8"/><path d="M140 150L230 50L320 150Z" fill="#9c8bd6"/><path d="M215 72L230 50L245 72L230 67Z" fill="#fff"/><rect y="150" width="320" height="50" fill="#9be3a6"/>'}[c.place];
 let w='';
 if(c.weather=='sunny')w='<circle cx="45" cy="38" r="22" fill="#ffd23f"/><circle cx="45" cy="38" r="30" fill="#ffd23f" opacity=".3"/>';
 if(c.weather=='cloudy')w=cl(60,35,'#fff')+cl(250,30,'#fff');
 if(c.weather=='rainy'){w=cl(60,35,'#8a96b5')+cl(250,30,'#8a96b5');for(let i=0;i<14;i++)w+=`<path d="M${25+i*22} ${55+(i%3)*18}l-4 12" stroke="#4f7bd8" stroke-width="3" stroke-linecap="round"/>`}
 if(c.weather=='snowy'){for(let i=0;i<16;i++)w+=`<circle cx="${15+i*19}" cy="${25+(i*37)%110}" r="4" fill="#fff"/>`}
 const hb=c.hobby?`<circle cx="62" cy="100" r="20" fill="#fff" stroke="#dcd3ff" stroke-width="3"/><text x="62" y="108" font-size="22" text-anchor="middle">${HB[c.hobby][2]}</text>`:'';
 return `<svg class="scene" viewBox="0 0 320 200" role="img" aria-label="Leo, a balloon, the weather and the place"><rect width="320" height="200" fill="${sky}"/>${w}${g}${hb}
 <path d="M205 66q-8 30 5 55" stroke="#8a7aa8" stroke-width="2" fill="none"/>
 <ellipse cx="205" cy="42" rx="24" ry="28" fill="${bl}"/><ellipse cx="197" cy="33" rx="6" ry="9" fill="#fff" opacity=".55"/>
 <rect x="112" y="158" width="9" height="20" rx="4" fill="#5a4a7a"/><rect x="129" y="158" width="9" height="20" rx="4" fill="#5a4a7a"/>
 <rect x="104" y="124" width="42" height="40" rx="15" fill="${sh}" stroke="#d8cdf5" stroke-width="2"/>
 <circle cx="125" cy="102" r="21" fill="#ffd9bf"/><path d="M104 100q2-24 21-24t21 24q-10-10-21-10t-21 10z" fill="#3b2f4f"/>
 <circle cx="118" cy="104" r="2.5" fill="#3b2f4f"/><circle cx="132" cy="104" r="2.5" fill="#3b2f4f"/>
 <circle cx="112" cy="111" r="4" fill="#ffb3c1" opacity=".8"/><circle cx="138" cy="111" r="4" fill="#ffb3c1" opacity=".8"/>
 <path d="M120 113q5 5 10 0" stroke="#3b2f4f" stroke-width="2" fill="none" stroke-linecap="round"/>
 <path d="M146 130q22-15 30-40" stroke="#ffd9bf" stroke-width="8" stroke-linecap="round" fill="none"/></svg>`}

/* ---------- audio ---------- */
let spk=0,cur=null;
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function voice(){const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
 return v.find(x=>/natural|google us|samantha|aria|jenny|siri|premium|enhanced/i.test(x.name))||v.find(x=>/en-US/i.test(x.lang))||v[0]}
function stopA(){spk++;if(cur){cur.pause();cur=null}if('speechSynthesis' in window)speechSynthesis.cancel();document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'))}
function fallback(t,rate,done){
 if(!('speechSynthesis' in window)){done();return}
 const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate*.9;u.pitch=1.05;const v=voice();if(v)u.voice=v;
 u.onend=done;u.onerror=done;speechSynthesis.speak(u)}
function warn(t){let e=document.getElementById('amsg');
 if(!e){e=document.createElement('div');e.id='amsg';e.setAttribute('role','status');e.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;background:#fff0d6;color:#7a4a00;border:3px solid #ff9f1c;border-radius:16px;padding:10px 16px;z-index:9;font-size:.85em';document.body.appendChild(e)}
 e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',7000)}
function clip(t,rate,done){
 let f=0;const strict=true;
 const fb=()=>{if(f)return;f=1;
  if(strict){warn('⚠️ No se pudo cargar el audio ElevenLabs: audio/'+slug(t)+'.mp3 · Revisa que la carpeta audio/ esté junto a index.html.');done()}
  else fallback(t,rate,done)};
 const a=new Audio('audio/'+slug(t)+'.mp3');cur=a;a.playbackRate=rate;a.preservesPitch=true;
 a.onended=()=>{if(!f){f=1;done()}};a.onerror=fb;a.play().catch(fb)}
function say(list,rate){
 stopA();const id=spk;let i=0;
 (function nx(){if(id!=spk||i>=list.length)return;
  document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));
  const el=document.getElementById('s'+i);if(el)el.classList.add('hl');
  clip(list[i],rate,()=>{if(id==spk){i++;nx()}})})()}
function listen(rate){say(story(S.c).map(s=>s[0]),rate)}

/* ---------- ui ---------- */
function toggleES(){S.es=!S.es;document.body.classList.toggle('tr',S.es);const b=document.getElementById('tr');b.textContent='🇨🇱 Español (Chile): '+(S.es?'ON':'OFF');b.setAttribute('aria-pressed',S.es)}
const stars=n=>`<span class="stars" aria-label="Level ${n}">${'★'.repeat(n)}${'☆'.repeat(3-n)}</span>`;
function steps(){const o=['read','cloze','create'],cur=['write','puzzle','end'].includes(S.st)?'create':S.st,n=[['1. Read','1. Lee'],['2. Complete','2. Completa'],['3. Recreate','3. Recrea']];
 return `<div class="steps">${n.map((x,i)=>`<div class="step ${o[i]==cur?'cur':(o.indexOf(cur)>i||S.st=='end')?'ok':''}">${T(x[0],x[1])}</div>`).join('')}</div>`}
function go(s){stopA();S.st=s;render()}
function render(){
 const a=document.getElementById('app');let h=(S.st!='read'?`<button onclick="back()" style="margin-bottom:12px">⬅ ${T('Back','Volver')}</button>`:'')+steps();
 if(S.st=='read')h+=readView();
 else if(S.st=='cloze'){if(!S.q)startQuiz(clozeItems(),()=>go('create'));h+=quizView()}
 else if(S.st=='create')h+=createView();
 else if(S.st=='write'){if(!S.q)startQuiz(writeItems(),()=>go('puzzle'));h+=quizView()}
 else if(S.st=='puzzle')h+=puzView();
 else h+=endView();
 a.innerHTML=h;const f=a.querySelector('#ti');if(f)f.focus()}

function readView(){const st=story(D0.c||D0);
 return `<div class="card"><h2>The Little Blue Balloon</h2>
 <p>${T('1. Read the story. Press <b>Listen</b> to hear it.','1. Lee la historia. Presiona <b>Listen</b> para escucharla.')}</p>
 ${scene(D0)}<div class="row" style="margin:14px 0"><button class="go" onclick="listen(1)">🔊 ${T('Listen','Escuchar')}</button><button onclick="listen(.8)">🐢 ${T('Slow','Escuchar más lento')}</button><button onclick="stopA()">⏹ ${T('Stop','Detener')}</button></div>
 <div class="story">${st.map((s,i)=>`<p><span class="sn" id="s${i}">${s[0]}</span><span class="es">${s[1]}</span></p>`).join('')}</div>
 <div class="row" style="margin-top:14px"><button class="go" onclick="enter('cloze')">${T('Next: Complete ➜','Siguiente: Completa ➜')}</button></div></div>`}
function clozeItems(){const mk=(s,a,o,h,re,lv)=>({s,a,o,h,re,lv,cat:'read',bank:lv==2});return [
 mk('He is ___ years old.','twelve',['ten','twelve','two'],'Leo is twelve years old.','Tiene ___ años.',1),
 mk('Today is his ___.','birthday',['birthday','holiday','Monday'],'Today is his birthday.','Hoy es su ___.',1),
 mk('His ___ gives him a big blue balloon.','grandfather',['grandfather','teacher','father'],'His grandfather gives him a big blue balloon.','Su ___ le regala un globo grande azul.',1),
 mk('The wind is ___.','strong',['strong','blue','happy'],'The wind is strong. Whoosh!','El viento está ___.',1),
 mk('They walk to the ___.','park',null,'They walk to the park.','Caminan al ___.',2),
 mk('The balloon flies up into the ___.','sky',null,'The balloon flies up into the sky.','El globo vuela hacia el ___.',2),
 mk('Leo ___ it very much.','loves',null,'Leo loves it very much.','A Leo le ___.',2),
 mk('It looks like a little blue ___.','star',null,'It looks like a little blue star.','Parece una pequeña ___ azul.',2)]}
function writeItems(){const c=S.c,mk=(s,a,o,h,he,re,cat)=>({s,a,o,h,he,re,lv:3,cat});
 const L=[mk('Leo is ___ years old.',AGE[c.age][0],null,`Write the number in letters. Hint: it starts with “${AGE[c.age][0][0]}”.`,`Escribe el número con letras. Pista: empieza con “${AGE[c.age][0][0]}”.`,`Leo tiene ___ años.`,'write'),
 mk('His grandfather gives him a big ___ balloon.',c.color,null,`You chose this color for the balloon: ${COL[c.color][1]}.`,`Elegiste este color: ${COL[c.color][1]}.`,'Su abuelo le regala un globo grande ___.','write'),
 mk('It is a ___ day.',c.weather,null,`You chose the weather: ${WE[c.weather][1]}. Write it in English.`,`Elegiste el clima: ${WE[c.weather][1]}. Escríbelo en inglés.`,'Es un día ___.','write'),
 mk(`Yesterday, they ___ to the ${PL[c.place][0]}.`,'walked',['walk','walked','walks'],'Yesterday = past. Past simple: walk + ed = walked.','“Yesterday” = pasado. Past simple: walk + ed = walked.',`Ayer, ellos ___ ${PL[c.place][1]}.`,'tense'),
 mk('Leo likes ___.',HB[c.hobby][0],[HB.soccer[0],HB.drawing[0],HB.dancing[0],HB.reading[0],HB.swimming[0]].slice(0,5),`You chose Leo’s hobby: ${HB[c.hobby][0]}.`,`Elegiste el hobby de Leo: ${HB[c.hobby][1]}.`,'A Leo le gusta ___.','write')];
 return L}

const TR={twelve:'doce',ten:'diez',two:'dos',birthday:'cumpleaños',holiday:'feriado',Monday:'lunes',grandfather:'abuelo',teacher:'profesor/a',father:'papá',strong:'fuerte',blue:'azul',happy:'feliz',park:'parque',sky:'cielo',loves:'encanta',star:'estrella',red:'rojo',green:'verde',yellow:'amarillo',pink:'rosado',purple:'morado',sunny:'soleado',cloudy:'nublado',rainy:'lluvioso',snowy:'nevado',eleven:'once',thirteen:'trece',fourteen:'catorce',soccer:'fútbol',walk:'caminan',walked:'caminaron',walks:'camina','playing soccer':'jugar al fútbol',drawing:'dibujar',dancing:'bailar',reading:'leer',swimming:'nadar'};
const tw=x=>x+(TR[x]?`<span class="es">${TR[x]}</span>`:'');
function resetCat(c){c.forEach(k=>S.stat[k]=[0,0]);S.miss=S.miss.filter(m=>!c.includes(m[1]))}
function enter(s){if(s=='cloze')resetCat(['read']);if(s=='write')resetCat(['write','tense']);S.q=null;go(s)}
function back(){const m={cloze:'read',create:'cloze',write:'create',puzzle:'create',end:'puzzle'};const t=m[S.st];if(t=='cloze')enter('cloze');else{S.q=null;go(t)}}
/* quiz engine */
function startQuiz(items,next){S.q={items,i:0,t:0,ok:false,next}}
const norm=s=>s.toLowerCase().replace(/[.!\s]+$/,'').trim();
function quizView(){const q=S.q,it=q.items[q.i],pct=Math.round(q.i/q.items.length*100);
 const bank=it.bank?`<div class="bank" aria-label="Word bank">${q.items.map(x=>x.a).sort().map(w=>`<span>${tw(w)}</span>`).join('')}</div>`:'';
 const sent=it.s.replace('___',`<span class="blank">${q.ok?it.a:'&nbsp;'}</span>`);
 const inp=q.ok?'':(it.o?`<div class="opts">${it.o.map(o=>`<button class="chip" onclick="ans(this.dataset.v)" data-v="${o}">${tw(o)}</button>`).join('')}</div>`
  :`${bank}<div class="row"><input type="text" id="ti" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Your answer" onkeydown="if(event.key==='Enter')ans(this.value)"><button class="go" onclick="ans(document.getElementById('ti').value)">${T('Check','Revisar')}</button></div>`);
 return `<div class="card"><div class="row" style="justify-content:space-between"><b>${T('Question','Pregunta')} ${q.i+1}/${q.items.length}</b>${stars(it.lv)}</div>
 <div class="bar" style="margin:8px 0 16px"><i style="width:${pct}%"></i></div>
 <p>${T(it.lv==3?'3. Write the missing word for your new story.':'2. Complete the sentence.',it.lv==3?'3. Escribe la palabra que falta en tu nueva historia.':'2. Completa la oración.')}</p>
 <p style="font-size:1.25em"><span>${sent}</span><span class="es">${it.re}</span></p>
 <div class="row"><button onclick="say([it_full()],S.spd||1)">🔊</button></div>${inp}<div id="fb" role="status"></div>
 ${q.ok?`<button class="go" onclick="nextQ()" id="nx">${T('Next ➜','Siguiente ➜')}</button>`:''}</div>`}
function it_full(){const it=S.q.items[S.q.i];return it.s.replace('___',it.a)}
function ans(v){const q=S.q,it=q.items[q.i];if(!v||!v.trim())return;
 const ok=norm(v)==norm(it.a);
 if(q.t==0){const k=it.cat;S.stat[k][1]++;if(ok)S.stat[k][0]++;else S.miss.push([it.a,it.cat])}
 q.t++;
 if(ok){q.ok=true;render();document.getElementById('fb').innerHTML=`<div class="fb good">✅ ${T('Great! '+it_full(),'¡Muy bien! Respuesta: '+it.a)}</div>`;const n=document.getElementById('nx');if(n)n.focus()}
 else{const hint=q.t>=2&&!it.o?` (${it.a[0]}…)`:'';
  document.getElementById('fb').innerHTML=`<div class="fb try">💡 ${T('Not yet. '+(it.he?it.h:'Check the story: “'+it.h+'”')+hint+' Try again!',(it.he?it.he:'Revisa la historia: “'+it.h+'”')+' ¡Inténtalo otra vez!')}</div>`;
  const f=document.getElementById('ti');if(f){f.select();f.focus()}}}
function nextQ(){const q=S.q;q.i++;q.t=0;q.ok=false;if(q.i>=q.items.length){const n=q.next;S.q=null;n()}else render()}

/* recreate */
function grp(k,en,es,opts,lab){return `<div class="grp"><b>${T(en,es)}</b><div class="row">${opts.map(o=>`<button class="chip ${S.c[k]==o[0]?'on':''}" aria-pressed="${S.c[k]==o[0]}" onclick="pick('${k}','${o[0]}')">${lab?o[2]||'':''}${o[1]}<span class="es">${o[3]||''}</span></button>`).join('')}</div></div>`}
function pick(k,v){S.c[k]=k=='age'?+v:v;render()}
function setSpd(v){S.spd=v;render()}
function spdChips(){const s=S.spd||1;return `<div class="grp"><b>${T('Audio speed','Velocidad del audio')}</b><div class="row">${[[.8,'Slow','Lento'],[1,'Normal','Normal'],[1.2,'Fast','Rápido']].map(o=>`<button class="chip ${s==o[0]?'on':''}" aria-pressed="${s==o[0]}" onclick="setSpd(${o[0]})">${T(o[1],o[2])}</button>`).join('')}</div></div>`}
function createView(){const c=S.c,l=S.l3;
 let g=grp('place','Place','Lugar',Object.keys(PL).map(k=>[k,PL[k][0],'',PL[k][2]]))+grp('weather','Weather','Clima',Object.keys(WE).map(k=>[k,WE[k][0],'',WE[k][1]]))+grp('color','Balloon color','Color del globo',Object.keys(COL).map(k=>[k,k,'',COL[k][1]]));
 if(l>=2)g+=grp('age','Leo’s age','Edad de Leo',Object.keys(AGE).map(k=>[k,k,'',AGE[k][1]]))+grp('hobby','Favorite hobby','Hobby favorito',Object.keys(HB).map(k=>[k,HB[k][0],HB[k][2]+' ',HB[k][1]]),1)+grp('shirt','T-shirt color','Color de la polera',Object.keys(COL).map(k=>[k,k,'',COL[k][1]]));
 const ready=l==1||(c.hobby&&c.shirt);
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${T('Recreate the story','Recrea la historia')}</h2>${stars(l)}</div>
 <p>${T('3. Choose the new details. The picture and the story change!','3. Elige los nuevos detalles. ¡La imagen y la historia cambian!')}</p>
 ${scene(c)}<div class="row" style="margin:12px 0"><button onclick="listen(S.spd||1)">🔊 ${T('Listen','Escuchar')}</button><button onclick="listen(.8)">🐢 ${T('Slow','Escuchar más lento')}</button><button onclick="stopA()">⏹ ${T('Stop','Detener')}</button></div>
 ${spdChips()}${g}<div class="row">${l==1?`<button class="go" onclick="S.l3=2;render()">${T('Level 2: more choices ➜','Nivel 2: más opciones ➜')}</button>`:`<button class="go" ${ready?'':'disabled'} onclick="enter('write')">${T('Level 3: write ➜','Nivel 3: escribe ➜')}</button>`}</div>
 ${l==2&&!ready?`<p>${T('Choose a hobby and a T-shirt color.','Elige un hobby y un color de polera.')}</p>`:''}
 <div class="story"><h3>${T('Your story','Tu historia')}</h3>${story(c).map((s,i)=>`<p><span class="sn" id="s${i}">${s[0]}</span><span class="es">${s[1]}</span></p>`).join('')}</div></div>`}

/* word search */
const PW={colors:['blue','red','green','yellow','pink','purple'],weather:['sunny','cloudy','rainy','snowy'],numbers:['ten','eleven','twelve','thirteen','fourteen'],hobbies:['soccer','drawing','dancing','reading','swimming']};
const PWL={colors:['Colors','Colores'],weather:['Weather','Clima'],numbers:['Numbers','Números'],hobbies:['Hobbies','Hobbies']};
const ALLW=()=>Object.values(PW).flat();
function makePuz(N){
 const words=ALLW().slice().sort((a,b)=>b.length-a.length),D=[[0,1],[1,0],[1,1]];
 for(let t=0;t<400;t++){
  const g=Array.from({length:N},()=>Array(N).fill(''));let ok=true;
  for(const w of words){let placed=false;
   for(let k=0;k<200&&!placed;k++){
    const d=D[Math.random()*3|0],r=Math.random()*N|0,c=Math.random()*N|0;
    if(r+d[0]*(w.length-1)>=N||c+d[1]*(w.length-1)>=N)continue;
    let fit=true;for(let i=0;i<w.length;i++){const x=g[r+d[0]*i][c+d[1]*i];if(x&&x!==w[i].toUpperCase()){fit=false;break}}
    if(!fit)continue;
    for(let i=0;i<w.length;i++)g[r+d[0]*i][c+d[1]*i]=w[i].toUpperCase();placed=true}
   if(!placed){ok=false;break}}
  if(ok){const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])g[r][c]=L[Math.random()*26|0];
   return{g,found:[],fc:[],sel:null}}}
 return makePuz(N+1)}
function puzView(){if(!S.puz)S.puz=makePuz(12);const p=S.puz,N=p.g.length,tot=ALLW().length;
 const cells=p.g.map((row,r)=>row.map((ch,c)=>`<button class="cell ${p.fc.includes(r+','+c)?'fnd':''}" data-r="${r}" data-c="${c}" tabindex="${r+c?-1:0}" aria-label="${ch}, row ${r+1}, column ${c+1}" onclick="cellClick(this)">${ch}</button>`).join('')).join('');
 const lists=Object.keys(PW).map(k=>`<div><b>${T(PWL[k][0],PWL[k][1])}</b><div class="wl">${PW[k].map(w=>`<span id="w-${w}" class="${p.found.includes(w)?'ok':''}">${tw(w)}</span>`).join('')}</div></div>`).join('');
 return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${T('Word search','Sopa de letras')}</h2><b id="cnt">${p.found.length}/${tot}</b></div>
 <p>${T('Find the words. Tap the first letter, then the last letter. Words go right, down or diagonal (they can also be backwards).','Encuentra las palabras. Toca la primera letra y luego la última. Van hacia la derecha, hacia abajo o en diagonal (también pueden estar al revés).')}</p>
 <div class="bar"><i id="pbar" style="width:${Math.round(p.found.length/tot*100)}%"></i></div>
 <div id="grid" style="grid-template-columns:repeat(${N},1fr)" onkeydown="cellKey(event)" role="group" aria-label="Word search">${cells}</div>
 <div id="pm" role="status" style="min-height:2.2em;font-weight:600"></div>${lists}
 <div class="row"><button class="go" onclick="go('end')">${T('See my feedback ➜','Ver mi retroalimentación ➜')}</button></div></div>`}
const gc=(r,c)=>document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
function pmsg(en,es,good){document.getElementById('pm').innerHTML=`<span style="color:${good?'#0a5a3e':'#7a4a00'}">${T(en,es)}</span>`}
function cellClick(el){
 const p=S.puz,r=+el.dataset.r,c=+el.dataset.c;
 if(!p.sel){p.sel=[r,c];el.classList.add('sel');pmsg('Now tap the last letter.','Ahora toca la última letra.',1);return}
 const [r0,c0]=p.sel;p.sel=null;document.querySelectorAll('.cell.sel').forEach(x=>x.classList.remove('sel'));
 if(r0==r&&c0==c)return;
 const dr=r-r0,dc=c-c0;
 if(dr&&dc&&Math.abs(dr)!=Math.abs(dc)||false){pmsg('Not a straight line. Try again.','No es una línea recta. Inténtalo otra vez.',0);return}
 const n=Math.max(Math.abs(dr),Math.abs(dc))+1,sr=Math.sign(dr),sc=Math.sign(dc),pos=[];
 for(let i=0;i<n;i++)pos.push([r0+sr*i,c0+sc*i]);
 const s=pos.map(x=>p.g[x[0]][x[1]]).join(''),rv=[...s].reverse().join('');
 const w=ALLW().find(x=>!p.found.includes(x)&&(x.toUpperCase()==s||x.toUpperCase()==rv));
 if(!w){pmsg('Not a word from the list. Try again!','No es una palabra de la lista. ¡Inténtalo otra vez!',0);return}
 p.found.push(w);pos.forEach(x=>{p.fc.push(x[0]+','+x[1]);gc(x[0],x[1]).classList.add('fnd')});
 document.getElementById('w-'+w).classList.add('ok');
 const tot=ALLW().length;document.getElementById('cnt').textContent=p.found.length+'/'+tot;document.getElementById('pbar').style.width=Math.round(p.found.length/tot*100)+'%';
 if(p.found.length==tot)pmsg('🎉 You found all the words!','🎉 ¡Encontraste todas las palabras!',1);
 else pmsg('✅ Great! You found “'+w+'”.','✅ ¡Muy bien! Encontraste “'+w+'” ('+(TR[w]||'')+').',1)}
function cellKey(e){
 const k={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];if(!k)return;
 const t=e.target.closest('.cell');if(!t)return;e.preventDefault();
 const n=gc(+t.dataset.r+k[0],+t.dataset.c+k[1]);if(n)n.focus()}

/* evidence */
function endView(){const c=S.c;
 const en=`Learning goal: ACHIEVED ✓`;
 const es=`Objetivo de aprendizaje: LOGRADO ✓`;
 return `<div class="card" style="text-align:center"><h2>🎉 ${T('Your story is ready!','¡Tu historia está lista!')}</h2><div class="badge">✅ ${T('Learning goal: Achieved','Objetivo: Logrado')}</div></div>
 <div class="card">${scene(c)}
 <div class="row" style="margin:12px 0"><button class="go" onclick="listen(1)">🔊 ${T('Listen','Escuchar')}</button><button onclick="listen(.8)">🐢 ${T('Slow','Escuchar más lento')}</button></div>
 <div class="story">${story(c).map((s,i)=>`<p><span class="sn" id="s${i}">${s[0]}</span><span class="es">${s[1]}</span></p>`).join('')}</div></div>
 <div class="card"><h2>${T('Learning evidence','Evidencia de aprendizaje')}</h2>
 <pre id="rep">${en}</pre><p class="es">${es}</p>
 <div class="row"><button class="go" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('rep').textContent);this.textContent='✅ Copied'">📋 Copy</button><button onclick="window.print()">🖨 Print</button><button onclick="S={es:S.es,st:'read',c:{...D0},l3:1,q:null,stat:{read:[0,0],write:[0,0],tense:[0,0]},miss:[]};render()">🔁 ${T('Start again','Empezar de nuevo')}</button></div></div>`}
render();
</script>
